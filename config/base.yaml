mode: paper
symbol_allowlist: [AAPL, MSFT, SPY]

runtime:
  database_path: data/trading.db
  kill_switch_path: data/KILL_SWITCH

strategy:
  name: example_slow_swing
  config:
    target_qty: 1

risk:
  max_orders_per_day: 6
  max_position_notional: 5000
  daily_loss_limit: 200
  max_order_qty: 1000
  rules: [state, kill_switch, target, symbol, market, loss, rate, exposure, duplicate]

execution:
  order_type: MKT
  time_in_force: DAY
  entrust_type: QTY

broker:
  region: us
  market: US

market_data:
  provider: webull
  paper_fill_price: null