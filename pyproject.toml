[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeframe"
version = "0.1.0"
description = "A deliberately boring, safety-first automated trading system."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
webull = ["webull-openapi-python-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["core*", "execution*", "strategies*", "reconciliation*", "observability*", "runners*"]